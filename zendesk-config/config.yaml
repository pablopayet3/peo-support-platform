# Zendesk configuration as code for the Northwind PEO life-event flow.
# `python apply.py plan` shows what would change; `python apply.py apply` makes the changes.
# References are resolved at apply time: {field:Title}, {group:Name}, {webhook:Name}.

ticket_fields:
  - title: Life event type
    type: tagger
    options:
      - { name: Newborn, value: qle_newborn }
      - { name: Adoption, value: qle_adoption }
      - { name: Marriage, value: qle_marriage }
      - { name: Loss of other coverage, value: qle_loss_of_coverage }
  - title: AI intake result
    type: tagger
    options:
      - { name: Complete, value: ai_intake_complete }
      - { name: Incomplete, value: ai_intake_incomplete }
      - { name: "Failed: no active plan", value: ai_fail_no_plan }
      - { name: "Failed: identity not confirmed", value: ai_fail_identity }
      - { name: "Failed: outside enrollment window", value: ai_fail_window }
  - title: Event date
    type: date
  - title: Enrollment outcome
    type: tagger
    options:
      - { name: Approved, value: qle_approved }
      - { name: Approved with carrier exception, value: qle_approved_exception }
      - { name: Not eligible, value: qle_not_eligible }
      - { name: Withdrawn, value: qle_withdrawn }
  - title: Enrollment ID
    type: text
  - title: AI handling
    # Set by the AI agent's tags. The three levels from the case study: automate the reversible,
    # gate the irreversible, escalate the harmful.
    type: tagger
    options:
      - { name: Automated, value: ai_tier_automated }
      - { name: Human approval, value: ai_tier_human_gate }
      - { name: Human-led, value: ai_tier_human_led }

groups:
  - Benefits Ops
  - Benefits Escalation
  - Payments

webhooks:
  # Zendesk generates each signing secret. Copy it once into the service's variables
  # (INT_ZENDESK_WEBHOOK_SECRET / AGENT_ZENDESK_WEBHOOK_SECRET); this tool never reads secrets.
  - name: Integration service - checks
    endpoint: ${INTEGRATION_URL}/v1/webhooks/zendesk
  - name: Email intake agent
    endpoint: ${AGENT_URL}/v1/webhooks/zendesk

trigger_category: "Benefits: life events"

triggers:
  - title: "05-INTAKE | New email ticket | Email intake agent"
    description: Hands every new email ticket to the email intake agent, which decides whether it is a life event.
    all:
      - { field: update_type, operator: is, value: Create }
      - { field: via_id, operator: is, value: "4" }
    actions:
      - { field: notification_webhook, value: ["{webhook:Email intake agent}", '{"ticket_id": "{{ticket.id}}"}'] }
  - title: "06-INTAKE | Customer answered the agent | Email intake agent"
    description: The customer replied while the agent was waiting for an answer.
    all:
      - { field: update_type, operator: is, value: Change }
      - { field: comment_is_public, operator: is, value: "true" }
      - { field: role, operator: is, value: end_user }
    any:
      - { field: current_tags, operator: includes, value: ai_intake_confirming }
      - { field: current_tags, operator: includes, value: ai_intake_waiting_date }
      - { field: current_tags, operator: includes, value: ai_intake_waiting_company }
    actions:
      - { field: notification_webhook, value: ["{webhook:Email intake agent}", '{"ticket_id": "{{ticket.id}}"}'] }
  - title: "07-INTAKE | New voicemail or call | Email intake agent"
    description: Same agent and rules for the phone. The agent reads the voicemail transcript, identifies the caller by phone number, and writes a callback script instead of a reply.
    all:
      - { field: update_type, operator: is, value: Create }
    any:
      - { field: via_id, operator: is, value: "44" }   # voicemail
      - { field: via_id, operator: is, value: "45" }   # inbound call
    actions:
      - { field: notification_webhook, value: ["{webhook:Email intake agent}", '{"ticket_id": "{{ticket.id}}"}'] }
  - title: "10-ESC | Coverage failure | Benefits Escalation, Urgent"
    description: Harm may already be happening. A person takes over at once; the AI only gathered the facts.
    all:
      - { field: current_tags, operator: includes, value: ai_coverage_failure }
      - { field: current_tags, operator: not_includes, value: esc_routed }
    actions:
      - { field: group_id, value: "{group:Benefits Escalation}" }
      - { field: priority, value: urgent }
      - { field: ticket_type_id, value: incident }
      - { field: current_tags, value: esc_routed }
      - { field: notification_group, value: ["{group:Benefits Escalation}", "Coverage failure: {{ticket.title}}", "Possible coverage failure on ticket {{ticket.id}}. The AI agent's note lists who wrote and their coverage.\n{{ticket.link}}"] }
  - title: "15-PAY | Money correction | Payments, Urgent"
    description: A double charge, overcharge or refund. Urgent whether or not the sender is verified; no refund until they are.
    all:
      - { field: current_tags, operator: includes, value: ai_request_money_correction }
      - { field: current_tags, operator: not_includes, value: pay_routed }
    actions:
      - { field: group_id, value: "{group:Payments}" }
      - { field: priority, value: urgent }
      - { field: current_tags, value: pay_routed }
  - title: "20-URG | Life event, AI check failed | Benefits Ops, Urgent"
    description: A check failed. The ticket goes to Benefits Ops as urgent and the group is notified.
    all:
      - { field: "{field:Life event type}", operator: is, value: qle_newborn }
      - { field: current_tags, operator: not_includes, value: qle_check_failed }
    any:
      - { field: "{field:AI intake result}", operator: is, value: ai_fail_no_plan }
      - { field: "{field:AI intake result}", operator: is, value: ai_fail_identity }
      - { field: "{field:AI intake result}", operator: is, value: ai_fail_window }
    actions:
      - { field: group_id, value: "{group:Benefits Ops}" }
      - { field: priority, value: urgent }
      - { field: current_tags, value: qle_routed qle_check_failed }
      - { field: notification_group, value: ["{group:Benefits Ops}", "Life event check failed: {{ticket.title}}", "The AI intake check failed on ticket {{ticket.id}}. Reason: see the AI intake result field.\n{{ticket.link}}"] }
  - title: "30-ROUTE | Life event, all other cases | Benefits Ops"
    description: Every other newborn request goes to Benefits Ops at normal priority.
    all:
      - { field: "{field:Life event type}", operator: is, value: qle_newborn }
      - { field: current_tags, operator: not_includes, value: qle_routed }
    actions:
      - { field: group_id, value: "{group:Benefits Ops}" }
      - { field: priority, value: normal }
      - { field: current_tags, value: qle_routed }
  - title: "40-DUE | Life event without a deadline | High"
    description: A life event without a due date yet (checks not run or incomplete) is raised to high priority.
    all:
      - { field: "{field:Life event type}", operator: present }
      - { field: ticket_due_date, operator: is, value: "false" }
      - { field: status, operator: less_than, value: solved }
      - { field: priority, operator: is_not, value: high }
      - { field: priority, operator: is_not, value: urgent }
    actions:
      - { field: priority, value: high }
  - title: "45-CHECK | Life event without checks | Integration service"
    description: A person filled in the life-event fields (phone, or by hand). The integration service runs the checks.
    all:
      - { field: "{field:Life event type}", operator: present }
      - { field: "{field:AI intake result}", operator: not_present }
      - { field: current_tags, operator: not_includes, value: qle_check_requested }
      - { field: status, operator: less_than, value: solved }
    actions:
      - { field: current_tags, value: qle_check_requested }
      - { field: notification_webhook, value: ["{webhook:Integration service - checks}", '{"ticket_id": "{{ticket.id}}"}'] }
